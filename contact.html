      <form id="contactForm">
        <input type="hidden" name="_subject" value="New contact message from your portfolio website">
        <input type="hidden" name="_captcha" value="false">

        <label>Name:</label>
        <input type="text" name="name" placeholder="Your name" required>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Your email" required>

        <label>Message:</label>
        <textarea name="message" rows="4" placeholder="Write your message here..." required></textarea>

        <button type="submit">Send Message</button>
      </form>
      <div id="form-status" class="form-status" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    © 2025 Daniel Sankale. All Rights Reserved.
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const statusBox = document.getElementById('form-status');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const name = form.elements.name.value.trim();
      const email = form.elements.email.value.trim();
      const message = form.elements.message.value.trim();

      if (!name || !email || !message) {
        statusBox.textContent = 'Please fill in all fields before sending.';
        statusBox.classList.add('show', 'error');
        return;
      }

      statusBox.textContent = 'Sending your message...';
      statusBox.classList.add('show');
      statusBox.classList.remove('error');

      try {
        const response = await fetch('https://formsubmit.co/ajax/danielsankale1@email.com', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            name: name,
            email: email,
            message: message,
            _subject: 'New contact message from your portfolio website',
            _captcha: 'false'
          })
        });

        if (response.ok) {
          statusBox.textContent = 'Your message was sent successfully! I will get back to you soon.';
          statusBox.classList.add('show');
          statusBox.classList.remove('error');
          form.reset();
        } else {
          throw new Error('Submission failed');
        }
      } catch (error) {
        statusBox.textContent = 'Something went wrong. Please try again or contact me directly.';
        statusBox.classList.add('show', 'error');
      }
    });
  </script>
